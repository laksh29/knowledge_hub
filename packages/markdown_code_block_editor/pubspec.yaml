name: markdown_code_block_editor
description: >
  Fenced-code-block-aware TextEditingController and highlighting widget for
  Markdown source text. All styling is caller-supplied; zero dependency on
  any consuming app's domain types or design tokens.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
