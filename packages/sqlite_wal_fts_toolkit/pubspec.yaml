name: sqlite_wal_fts_toolkit
description: >
  Generic WAL-mode SQLite database opener and FTS5 virtual-table/trigger SQL
  builders, parameterized only by file/table/column names. Zero dependency on
  any consuming app's domain types.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.4

dependencies:
  drift: ^2.34.3
  sqlite3: ^3.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
